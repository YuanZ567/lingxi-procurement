# ============================================================
# 灵犀采购 · 测试分层配置
# ------------------------------------------------------------
# 跑法（项目根目录）：
#   pytest -m unit            # 单测：毫秒级，不依赖外部服务，CI 必跑
#   pytest -m integration     # 集成：依赖 MySQL/Redis，不调真实 LLM
#   pytest -m e2e             # 端到端验收：依赖真实 LLM，分钟级，发版前跑
#   pytest                    # 全跑（含 e2e，慢）
# 覆盖率报告：reports/coverage/index.html
# ============================================================

[pytest]
# 只收集 tests/ 目录（根目录那批 test_*.py 是开发期冒烟脚本，仍可 python xxx.py 手动跑）
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra 显示所有非通过用例的摘要；--strict-markers 防止 marker 拼错被静默忽略
addopts = -ra --strict-markers
         --cov=src
         --cov-report=term-missing
         --cov-report=html:reports/coverage
         --cov-report=xml:reports/coverage.xml

# 分层标记
markers =
    unit: 单元测试——纯函数/校验器，不依赖 MySQL/Redis/LLM，毫秒级
    integration: 集成测试——依赖 MySQL/Redis，不调用真实 LLM（LLM 一律 mock）
    e2e: 端到端验收——真实 LLM + 完整业务流水线，分钟级，发版前执行
    slow: 耗时用例（>10s），日常开发可跳过

# 异步用例自动识别（无需逐个写 @pytest.mark.asyncio）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 让测试里的 warning 可读，不刷屏
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

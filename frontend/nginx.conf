# nginx 服务器配置
server {
    # 监听 80 端口（容器内）
    listen 80;

    # 前端静态文件目录（Dockerfile 里复制过去的 dist 就在这）
    root /usr/share/nginx/html;
    index index.html;

    # ---- 规则 1：/api 开头的请求 → 转发给后端 ----
    location /api {
        # backend = docker-compose 里后端服务名，容器内通过服务名互访
        # 8000 = 后端 uvicorn 监听的端口
        proxy_pass http://backend:8000;

        # 把原始请求头（Host、IP 等）原样传过去，后端才知道是谁在请求
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ★ 关键：你的项目有 SSE 流式接口（sse_api.py），
        # 必须关掉 nginx 缓冲，否则流式响应会被"憋住"不推送
        proxy_buffering off;
        proxy_cache off;
    }

    # ---- 规则 2：其他请求 → 找前端静态文件 ----
    location / {
        # 优先找真实文件，找不到就回退 index.html
        # （Vue 是单页应用，前端路由切换时 URL 变了但文件没变，必须回退）
        try_files $uri $uri/ /index.html;
    }
}
